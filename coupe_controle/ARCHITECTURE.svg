<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="flecheClair" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .titre   { font-size: 30px; font-weight: 700; fill: #0f172a; }
      .soustit { font-size: 15px; fill: #475569; }
      .boite   { font-size: 16px; font-weight: 600; }
      .petit   { font-size: 12.5px; fill: #475569; }
      .lien    { font-size: 13px; font-weight: 600; fill: #334155; }
      .lienf   { font-size: 12.5px; fill: #64748b; }
      .chip    { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="920" fill="#f8fafc"/>

  <text x="40" y="52" class="titre">Sentinelle — architecture</text>
  <text x="40" y="77" class="soustit">Contrôle de coupe + suivi de production (Laisné Industrie) — V6.4.</text>
  <text x="40" y="99" class="soustit">Tout ce qui transite par le mini-site est chiffré de bout en bout ; le code de liaison (16 car.) n'est jamais envoyé.</text>

  <!-- ===================== SOURCES (lecture seule) ===================== -->
  <g>
    <rect x="40" y="150" width="230" height="86" rx="12" fill="#eef2f6" stroke="#cbd5e1"/>
    <text x="56" y="182" class="boite" fill="#334155">Fichiers LAN (.xlsx)</text>
    <text x="56" y="204" class="petit">+ projets .bkp (Cut Rite)</text>
    <text x="56" y="223" class="petit" fill="#b45309">jamais modifiés</text>
  </g>
  <g>
    <rect x="40" y="300" width="230" height="86" rx="12" fill="#eef2f6" stroke="#cbd5e1"/>
    <text x="56" y="332" class="boite" fill="#334155">Extraction Diakonos</text>
    <text x="56" y="354" class="petit">suivi_production_*.xlsx</text>
    <text x="56" y="373" class="petit" fill="#b45309">pas d'accès SQL</text>
  </g>

  <!-- ===================== PC PRINCIPAL ===================== -->
  <rect x="360" y="120" width="300" height="300" rx="16" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="2"/>
  <text x="380" y="152" class="boite" font-size="18" fill="#1d4ed8">PC principal</text>
  <text x="380" y="173" class="petit">Sentinelle.exe → page web (Chrome)</text>

  <rect x="384" y="192" width="252" height="92" rx="10" fill="#ffffff" stroke="#93b4ef"/>
  <text x="402" y="220" class="boite" fill="#1e293b">Bibliothèque</text>
  <text x="402" y="241" class="petit">IndexedDB : semaines + lancements</text>
  <text x="402" y="261" class="petit">(pièces lancées, source des CVC)</text>

  <rect x="384" y="300" width="252" height="100" rx="10" fill="#ffffff" stroke="#93b4ef"/>
  <text x="402" y="328" class="boite" fill="#1e293b">Suivi de production</text>
  <text x="402" y="349" class="petit">avancement = lancées − en cours</text>
  <text x="402" y="369" class="petit">pièce validée = faite tout de suite</text>

  <!-- ===================== MINI-SITE ===================== -->
  <rect x="770" y="250" width="250" height="120" rx="16" fill="#efe9fb" stroke="#7c5cd6" stroke-width="2"/>
  <text x="790" y="284" class="boite" font-size="18" fill="#6d28d9">Mini-site Netlify</text>
  <text x="790" y="308" class="petit">relais chiffré</text>
  <text x="790" y="328" class="petit">ne stocke que des octets</text>
  <text x="790" y="346" class="petit">illisibles (AES-256-GCM)</text>

  <!-- ===================== TELEPHONE ===================== -->
  <rect x="1090" y="150" width="150" height="150" rx="16" fill="#e7f6ec" stroke="#2f9e5a" stroke-width="2"/>
  <text x="1108" y="184" class="boite" font-size="18" fill="#15803d">Téléphone</text>
  <text x="1108" y="208" class="petit">application Android</text>
  <text x="1108" y="228" class="petit">(APK)</text>
  <text x="1108" y="256" class="chip" fill="#15803d">lecteur</text>
  <text x="1108" y="278" class="petit">retours appliqués</text>
  <text x="1108" y="294" class="petit">par le PC</text>

  <!-- ===================== PC DE VALIDATION ===================== -->
  <rect x="360" y="560" width="470" height="250" rx="16" fill="#fdf0e3" stroke="#d97706" stroke-width="2"/>
  <text x="384" y="594" class="boite" font-size="18" fill="#b45309">PC de validation (× 2, imprimante Zebra USB)</text>
  <text x="384" y="616" class="petit">postes nommés — ex. « Crédences », « Plan de travail »</text>

  <rect x="384" y="636" width="200" height="150" rx="10" fill="#ffffff" stroke="#f0b267"/>
  <text x="402" y="664" class="boite" fill="#1e293b">Étiquette imprimée</text>
  <text x="402" y="686" class="petit">= pièce faite</text>
  <text x="402" y="712" class="petit">ZPL ^GFA = image</text>
  <text x="402" y="730" class="petit">(pas de texte exploitable,</text>
  <text x="402" y="747" class="petit">le CVC est dessiné)</text>

  <rect x="608" y="636" width="200" height="150" rx="10" fill="#ffffff" stroke="#f0b267"/>
  <text x="626" y="664" class="boite" fill="#1e293b">Agent de validation</text>
  <text x="626" y="686" class="petit">surveille le spool</text>
  <text x="626" y="704" class="petit">de l'imprimante</text>
  <text x="626" y="730" class="petit">chiffre + dépose sur</text>
  <text x="626" y="748" class="petit">le canal du poste</text>

  <!-- ===================== FLECHES ===================== -->
  <!-- LAN -> Bibliotheque -->
  <path d="M270,193 L384,221" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#flecheClair)"/>
  <text x="286" y="192" class="lienf">lecture seule</text>
  <!-- Extraction -> Suivi -->
  <path d="M270,343 L384,348" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#flecheClair)"/>
  <text x="286" y="333" class="lienf">lecture seule</text>

  <!-- PC -> Mini-site (chiffré) -->
  <path d="M660,250 C710,230 740,250 770,278" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="648" y="224" class="lien">état chiffré →</text>
  <text x="648" y="242" class="lienf">AES-256-GCM</text>

  <!-- Mini-site -> Suivi (lit le CVC) : retour vers le bas-gauche du PC -->
  <path d="M770,340 C700,400 680,392 660,388" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="664" y="432" class="lien">Sentinelle lit le CVC</text>
  <text x="664" y="450" class="lienf">→ pièce faite en direct</text>

  <!-- Mini-site -> Telephone -->
  <path d="M1020,278 C1060,250 1070,240 1090,228" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1030" y="238" class="lien">chiffré</text>
  <!-- Telephone -> Mini-site (retours) -->
  <path d="M1090,262 C1055,300 1050,318 1022,330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#flecheClair)"/>
  <text x="1012" y="360" class="lienf">retours chiffrés</text>

  <!-- Zebra -> Agent -->
  <path d="M584,711 L608,711" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#flecheClair)"/>

  <!-- Agent -> Mini-site (chiffré, 1 canal par poste) -->
  <path d="M808,666 C920,560 900,430 950,372" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="988" y="632" class="lien">étiquette chiffrée</text>
  <text x="988" y="650" class="lienf">1 canal par poste</text>

  <!-- ===================== LEGENDE ===================== -->
  <g>
    <rect x="40" y="470" width="640" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="58" y="496" class="petit" font-weight="700" fill="#334155">Clé de lecture</text>
    <line x1="58" y1="514" x2="88" y2="514" stroke="#334155" stroke-width="2" marker-end="url(#fleche)"/>
    <text x="96" y="519" class="petit">transite chiffré par le mini-site</text>
    <line x1="370" y1="514" x2="400" y2="514" stroke="#64748b" stroke-width="1.6" marker-end="url(#flecheClair)"/>
    <text x="408" y="519" class="petit">lecture seule / retour</text>
  </g>
</svg>
