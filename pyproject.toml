[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-budget"
version = "0.1.0"
description = "Client de bureau Linux pour l'appli de budget Oracle, connecté à la même base Firebase que l'appli Android."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.scripts]
oracle-budget = "oracle_budget.app:main"
coupe-controle = "coupe_controle.app:main"

[tool.setuptools.packages.find]
include = ["oracle_budget*", "coupe_controle*"]
